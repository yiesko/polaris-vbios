name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: polaris-vbios-windows-x86_64.exe
            bin_path: target/release/polaris-vbios.exe
          - os: ubuntu-latest
            artifact: polaris-vbios-linux-x86_64
            bin_path: target/release/polaris-vbios
          - os: macos-latest
            artifact: polaris-vbios-macos-x86_64
            bin_path: target/release/polaris-vbios
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Lint (clippy, warnings denied)
        run: cargo clippy --all-targets -- -D warnings

      - run: cargo build --release

      - run: cp ${{ matrix.bin_path }} ${{ matrix.artifact }}
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
